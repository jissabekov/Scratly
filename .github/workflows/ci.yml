# W1.6 engineering hygiene CI (docs/plan/01-fix-current-system.md §W1.6).
#
# - backend: every PR + push to main — ruff, compileall, pytest (no DB needed;
#   unit tests are hermetic).
# - eval-suite: manual trigger only (workflow_dispatch). Needs live Postgres
#   (docker compose) + a host-run API + Azure OpenAI credentials, so it never
#   runs on PRs. Supports `--only` (comma-separated scenario ids) and a custom
#   trace out_dir; the trace dir is always uploaded as a workflow artifact.
#
# Required secrets for eval-suite: AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY.
# The API reads config via pydantic-settings (apps/api/app/config.py); the DB
# URL below matches compose.yaml's postgres service defaults.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated scenario ids for --only (empty = all 21)"
        required: false
        default: ""
      out_dir:
        description: "Trace output dir (default: eval/traces/ci-<run_id>)"
        required: false
        default: ""

jobs:
  backend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Lint (ruff check + format check)
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api

      - name: Compile check
        run: python -m compileall -q apps/api/app

      - name: Unit tests
        run: python -m pytest apps/api/tests -q

  eval-suite:
    # Manual trigger only — needs live Postgres + Azure; never runs on PRs.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONIOENCODING: utf-8
      # Host-run API -> compose postgres published on 127.0.0.1:5432
      # (credentials match compose.yaml defaults).
      DATABASE_URL: postgresql+asyncpg://scratly:scratly_local_only@127.0.0.1:5432/scratly
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
      AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend deps
        run: pip install -r apps/api/requirements.txt

      - name: Start Postgres (applies migrations/ on first boot)
        run: docker compose up -d --wait postgres

      - name: Start API and wait for /health + /health/ready
        shell: bash
        run: |
          cd apps/api
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health > /dev/null; then
              echo "API /health OK"
              break
            fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health || {
            echo "::error::API did not become healthy on :8000"; exit 1; }
          curl -sf http://127.0.0.1:8000/health/ready || {
            echo "::error::API not ready — check AZURE_OPENAI_* secrets"; exit 1; }

      - name: Run conversation eval suite
        id: eval
        shell: bash
        run: |
          OUT_DIR="${{ inputs.out_dir }}"
          if [ -z "$OUT_DIR" ]; then
            OUT_DIR="eval/traces/ci-${{ github.run_id }}"
          fi
          echo "out_dir=$OUT_DIR" >> "$GITHUB_OUTPUT"
          ARGS=(--out-dir "$OUT_DIR")
          ONLY="${{ inputs.only }}"
          if [ -n "$ONLY" ]; then
            ARGS+=(--only "$ONLY")
          fi
          python scripts/eval_conversation_suite.py "${ARGS[@]}"

      - name: Upload eval traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-traces-${{ github.run_id }}
          path: ${{ steps.eval.outputs.out_dir }}
          if-no-files-found: warn
